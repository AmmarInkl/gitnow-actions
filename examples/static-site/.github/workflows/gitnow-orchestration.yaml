# GitNow: builds and deploys this repository to all-inkl on every push.
# Do not edit this file. Settings are in .deploy-now/my-site/config.yaml,
# build steps are in gitnow-build.yaml.
name: "GitNow"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      environment: ${{ steps.resolve.outputs.environment }}
      site-url: ${{ steps.resolve.outputs.site-url }}
      publish-dir: ${{ steps.resolve.outputs.publish-dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .deploy-now
      - id: resolve
        uses: AmmarInkl/gitnow-actions/resolve@v1
        with:
          project: my-site

  build:
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    uses: ./.github/workflows/gitnow-build.yaml
    with:
      site-url: ${{ needs.resolve.outputs.site-url }}
      publish-dir: ${{ needs.resolve.outputs.publish-dir }}
    secrets: inherit

  deploy:
    needs: [resolve, build]
    uses: ./.github/workflows/gitnow-deploy.yaml
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      site-url: ${{ needs.resolve.outputs.site-url }}
    secrets: inherit
