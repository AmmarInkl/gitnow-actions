# GitNow: uploads the build to all-inkl. Do not edit this file.
name: "GitNow: Deploy"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      site-url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to all-inkl
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site-url }}
    concurrency:
      group: gitnow-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .deploy-now

      - uses: actions/download-artifact@v4
        with:
          name: gitnow-site
          path: ${{ runner.temp }}/gitnow-artifact

      - uses: AmmarInkl/gitnow-actions/deploy@v1
        with:
          project: my-site
          artifact: ${{ runner.temp }}/gitnow-artifact/gitnow-site.tar.gz
          ftp-host: ${{ vars.GITNOW_FTP_HOST }}
          ftp-user: ${{ secrets.GITNOW_FTP_USER }}
          ftp-password: ${{ secrets.GITNOW_FTP_PASSWORD }}
          secrets: ${{ toJSON(secrets) }}
          variables: ${{ toJSON(vars) }}
